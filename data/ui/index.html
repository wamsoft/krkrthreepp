<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>threepp 編集UI</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#1e1e1e; color:#d4d4d4;
    font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif; font-size:14px; }
  body { display:flex; flex-direction:column; height:100vh; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:#252526; border-bottom:1px solid #333; flex:none; }
  #bar b { color:#4ec9b0; }
  #bar .mode { display:flex; gap:4px; }
  #bar .mode button { background:#333; color:#ccc; border:0; padding:4px 12px;
    border-radius:3px; cursor:pointer; }
  #bar .mode button.on { background:#0e639c; color:#fff; }
  #ctoggle { margin-left:auto; background:#3c3c3c; color:#ccc; border:0;
    padding:4px 10px; border-radius:3px; cursor:pointer; }
  #ctoggle.on { background:#0e639c; color:#fff; }
  #status { font-size:12px; color:#808080; }
  #wrap { flex:1; display:flex; overflow:hidden; }
  #main { flex:1; overflow-y:auto; padding:12px 16px; }
  #side { width:290px; flex:none; overflow-y:auto; padding:12px 12px 12px 0; }
  .group { margin:0 0 14px; border:1px solid #3c3c3c; border-radius:4px; }
  .group h3 { margin:0; padding:4px 10px; font-size:13px; background:#2d2d30;
    color:#9ad8ff; border-bottom:1px solid #3c3c3c; }
  .rows { padding:6px 10px; }
  .row { display:flex; align-items:center; gap:8px; padding:2px 0; }
  .row label { width:9em; color:#c2ccda; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .row input[type=range] { flex:1; }
  .row .val { width:4em; text-align:right; color:#88ecae; font-variant-numeric:tabular-nums; }
  .ops { display:flex; align-items:center; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .ops input[type=text] { background:#1e1e1e; color:#d4d4d4; border:1px solid #3c3c3c;
    padding:4px 8px; border-radius:3px; }
  button.act { background:#0e639c; color:#fff; border:0; padding:5px 14px;
    border-radius:3px; cursor:pointer; }
  button.act:hover { background:#1177bb; }
  button.sub { background:#3c3c3c; color:#ccc; border:0; padding:5px 10px;
    border-radius:3px; cursor:pointer; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { background:#2d2d30; color:#dcdcaa; border:1px solid #3c3c3c;
    padding:4px 10px; border-radius:3px; cursor:pointer; }
  .chips button:hover { border-color:#0e639c; }
  .chips button.on { background:#0e639c; color:#fff; border-color:#0e639c; }
  #notready { padding:24px; color:#f48771; display:none; flex:none; }
  .hint { color:#808080; font-size:12px; margin:6px 0; }
  .radio { display:flex; gap:12px; align-items:center; color:#c2ccda; }
  /* --- サイドバー (インスペクター/操作ログ) --- */
  .ins-char { border-bottom:1px solid #333; padding:6px 10px; }
  .ins-char .nm { font-weight:bold; color:#98a2b0; }
  .ins-char.sel .nm { color:#88ecae; }
  .ins-kv { display:flex; font-size:13px; padding:1px 0; }
  .ins-kv .k { width:4.5em; color:#c2ccda; }
  .ins-kv .v { color:#f4f6fa; }
  #oplog { font-size:13px; color:#c2ccda; padding:6px 10px; max-height:220px;
    overflow-y:auto; white-space:pre-wrap; word-break:break-all; }
  /* --- REPL コンソール --- */
  #console { flex:none; height:230px; display:none; flex-direction:column;
    border-top:1px solid #333; background:#181818;
    font-family:Consolas,"Cascadia Mono","MS Gothic",monospace; font-size:13px; }
  #console.show { display:flex; }
  #clog { flex:1; overflow-y:auto; padding:6px 10px; white-space:pre-wrap;
    word-break:break-word; }
  #clog .echo { color:#9cdcfe; } #clog .result { color:#6a9955; }
  #clog .error { color:#f48771; } #clog .help { color:#4ec9b0; }
  #clog .info { color:#d4d4d4; } #clog .warn { color:#dcdcaa; }
  #clog .debug { color:#4fc1ff; } #clog .verbose { color:#808080; }
  #clog .critical { color:#f14c4c; font-weight:bold; }
  #cin { display:flex; align-items:center; gap:6px; padding:5px 10px;
    border-top:1px solid #2a2a2a; }
  #cprompt { color:#6a9955; font-weight:bold; }
  #ccmd { flex:1; background:#1e1e1e; color:#d4d4d4; border:1px solid #3c3c3c;
    padding:4px 8px; border-radius:3px; font:inherit; }
</style></head>
<body>
<div id="bar">
  <b>threepp 編集UI</b>
  <div class="mode" id="modes"></div>
  <button id="ctoggle">REPL</button>
  <span id="status">connecting...</span>
</div>
<div id="notready">アプリ (advsample) が未起動です。</div>
<div id="wrap">
  <div id="main"></div>
  <div id="side"></div>
</div>
<div id="console">
  <div id="clog"></div>
  <div id="cin">
    <span id="cprompt">krkrz&gt;</span>
    <input id="ccmd" autocomplete="off" spellcheck="false"
      placeholder="TJS 式/文 (Enter=実行, .help=コマンド一覧, ↑↓=履歴)">
  </div>
</div>
<script>
(function(){
  var MODES = [["op","操作"],["face","表情"],["pose","ポーズ"],["seq","連番"],["char","キャラ"]];
  var statusEl = document.getElementById('status');
  var main = document.getElementById('main');
  var side = document.getElementById('side');
  var dragging = false;      // スライダ操作中は SSE 由来の再描画を抑止
  var state = null;
  var lastEditorKey = '';    // エディタ部の再構築判定 (insp/log の 4Hz 更新で壊さない)

  function post(path, obj){
    return fetch(path, {method:'POST', body: obj ? JSON.stringify(obj) : ''})
      .catch(function(){ statusEl.textContent = 'request failed'; });
  }

  // ---- スライダ送信の throttle (trailing 付き 50ms、キー単位で最新値のみ) ----
  var pend = {}, timer = null;
  function sendThrottled(key, path, obj){
    pend[key] = {path:path, obj:obj};
    if (timer) return;
    timer = setTimeout(function(){
      timer = null;
      var batch = pend; pend = {};
      Object.keys(batch).forEach(function(k){ post(batch[k].path, batch[k].obj); });
    }, 50);
  }

  // ---- 共通部品 ----
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function sliderRow(label, min, max, step, value, fmt, onInput){
    var row = el('div','row');
    var lab = el('label', null, label);
    var rng = el('input'); rng.type='range';
    rng.min=min; rng.max=max; rng.step=step; rng.value=value;
    var val = el('span','val', fmt(+value));
    rng.addEventListener('input', function(){
      val.textContent = fmt(+rng.value);
      onInput(+rng.value);
    });
    rng.addEventListener('pointerdown', function(){ dragging = true; });
    rng.addEventListener('pointerup', function(){ dragging = false; });
    row.appendChild(lab); row.appendChild(rng); row.appendChild(val);
    return row;
  }
  function groupBox(title){
    var box = el('div','group');
    box.appendChild(el('h3', null, title));
    var rows = el('div','rows');
    box.appendChild(rows);
    return {box:box, rows:rows};
  }
  function chipList(items, isOn, onClick){
    var wrap = el('div','chips');
    items.forEach(function(it){
      var b = el('button', isOn(it) ? 'on' : null, it.label);
      b.onclick = function(){ onClick(it); };
      wrap.appendChild(b);
    });
    return wrap;
  }

  // ---- 操作(op)ペイン ----
  // Elements パネルと同一 id を /app/op/panel へパススルーする。
  function opBtn(id, val){ post('/app/op/panel', val === undefined ? {id:id} : {id:id, val:val}); }
  function opChipRow(gb, items, isOn){
    gb.rows.appendChild(chipList(items,
      isOn || function(){ return false; },
      function(it){ opBtn(it.id, it.val); }));
  }
  function renderOp(){
    var o = state.op || {};
    var gbT = groupBox('対象 / モード');
    opChipRow(gbT, [
      {label:'左', id:'t_left', t:0}, {label:'右', id:'t_right', t:1},
      {label:'両方', id:'t_both', t:2}],
      function(it){ return o.target === it.t; });
    opChipRow(gbT, [
      {label:'立ち絵', id:'mode_tachie', m:'tachie'}, {label:'空間', id:'mode_space', m:'space'}],
      function(it){ return o.mode === it.m; });
    main.appendChild(gbT.box);

    if (o.mode === 'tachie'){
      var gbF = groupBox('フレーム');
      opChipRow(gbF, [
        {label:'全身', id:'f_full'}, {label:'膝上', id:'f_knee'}, {label:'腰上', id:'f_waist'},
        {label:'胸上', id:'f_bust'}, {label:'顔', id:'f_face'}]);
      main.appendChild(gbF.box);
    } else {
      var gbP = groupBox('位置 / 画角 / カメラ操作 / 背景');
      opChipRow(gbP, [
        {label:'← 左', id:'pos_left'}, {label:'右 →', id:'pos_right'},
        {label:'前(近)', id:'pos_fwd'}, {label:'後(遠)', id:'pos_back'},
        {label:'並べ直す', id:'pos_reset'}]);
      opChipRow(gbP, [
        {label:'望遠', id:'fov_tele'}, {label:'広角', id:'fov_wide'}]);
      opChipRow(gbP, [
        {label:'回り込み', id:'camm_orbit', v:'orbit'}, {label:'平行移動', id:'camm_move', v:'move'}],
        function(it){ return o.camMode === it.v; });
      opChipRow(gbP, [
        {label:'舞台に固定', id:'bg_fixed', v:false}, {label:'カメラ追従', id:'bg_follow', v:true}],
        function(it){ return !!o.bgFollow === it.v; });
      main.appendChild(gbP.box);
    }

    var gbE = groupBox('表情');
    opChipRow(gbE, (o.exprs||[]).map(function(e){ return {label:e.label, id:e.id}; }));
    main.appendChild(gbE.box);

    var gbM = groupBox('モーション');
    opChipRow(gbM, (o.motions||[]).map(function(m){ return {label:m.label, id:m.id}; })
      .concat([{label:'停止', id:'m_stop'}]));
    main.appendChild(gbM.box);

    var gbPo = groupBox('ポーズ (簡易スロット)');
    opChipRow(gbPo, [
      {label:'採取', id:'pose_cap'}, {label:'適用', id:'pose_apply'},
      {label:'素立ち', id:'pose_clear'}, {label:'保存', id:'pose_save'},
      {label:'読込', id:'pose_load'}]);
    main.appendChild(gbPo.box);

    var gbS = groupBox('シーン / 状態');
    opChipRow(gbS, (o.scenes||[]).map(function(s){ return {label:s.label, id:s.id}; })
      .concat([{label:'状態保存', id:'state_save'}, {label:'状態復元', id:'state_load'}]));
    main.appendChild(gbS.box);

    if (o.mode === 'tachie'){
      var gbX = groupBox('演出・音声');
      opChipRow(gbX, [
        {label:'フェードイン', id:'fx_fadein'}, {label:'フェードアウト', id:'fx_fadeout'},
        {label:'スライド登場', id:'fx_slidein'},
        {label:'発話(音声)', id:'lip_play'}, {label:'停止', id:'lip_stop'}]);
      main.appendChild(gbX.box);
    }

    var gbC = groupBox('カメラ');
    opChipRow(gbC, [
      {label:'◀', id:'cam_left'}, {label:'▶', id:'cam_right'},
      {label:'▲', id:'cam_up'}, {label:'▼', id:'cam_down'},
      {label:'寄る', id:'cam_in'}, {label:'引く', id:'cam_out'},
      {label:'正面', id:'cam_reset'}]);
    main.appendChild(gbC.box);

    var gbG = groupBox('切替 (クリックで ON/OFF)');
    opChipRow(gbG, [
      {label:'まばたき', id:'blink_set', val:!o.blink, on:!!o.blink},
      {label:'カメラ目線', id:'look_set', val:!o.look, on:!!o.look},
      {label:'idle', id:'idle_set', val:!o.idle, on:!!o.idle},
      {label:'視線ターゲット', id:'gaze_set', val:!o.gaze, on:!!o.gaze}],
      function(it){ return it.on; });
    main.appendChild(gbG.box);
  }

  // ---- 表情ペイン ----
  var faceDetail = false;     // 詳細モード (全モーフ表示) トグル
  var allMorphs = null;       // /app/face/morphs の結果キャッシュ
  function morphSliderRow(name, label){
    var w = (state.morphs && state.morphs[name]) || 0;
    return sliderRow(label, 0, 1, 0.01, w,
      function(v){ return v.toFixed(2); },
      function(v){
        if (state.morphs) state.morphs[name] = v;
        sendThrottled('mo:'+name, '/app/face/morph', {name:name, w:v});
      });
  }
  function renderFace(){
    var ops = el('div','ops');
    var nameIn = el('input'); nameIn.type='text'; nameIn.placeholder='表情名 (保存キー)';
    nameIn.value = state.editName || ''; nameIn.id='facename';
    var save = el('button','act','保存');
    save.onclick = function(){
      var id = nameIn.value.trim();
      if (!id) { alert('表情名を入力してください'); return; }
      post('/app/face/save', {id:id});
    };
    var clear = el('button','sub','クリア');
    clear.onclick = function(){ post('/app/face/clear'); };
    var detail = el('button', faceDetail ? 'act' : 'sub', '詳細 (全モーフ)');
    detail.onclick = function(){
      faceDetail = !faceDetail;
      if (faceDetail && !allMorphs) {
        fetch('/app/face/morphs').then(function(r){ return r.json(); })
          .then(function(m){ allMorphs = m; lastEditorKey=''; applyState(state); });
      } else { lastEditorKey=''; applyState(state); }
    };
    ops.appendChild(nameIn); ops.appendChild(save); ops.appendChild(clear);
    ops.appendChild(detail);
    main.appendChild(ops);

    main.appendChild(chipList(
      (state.faces||[]).map(function(id){ return {label:id, id:id}; }),
      function(){ return false; },
      function(it){ post('/app/face/load', {id:it.id}); }));

    (state.groups||[]).forEach(function(g){
      var gb = groupBox(g.title);
      g.items.forEach(function(it){
        gb.rows.appendChild(morphSliderRow(it.name,
          it.label + ' (' + it.name.replace(/^Fcl_/,'') + ')'));
      });
      main.appendChild(gb.box);
    });

    // 詳細モード: 対象 VRM の全モーフ (curated 済みは除外して残りを列挙)
    if (faceDetail && allMorphs){
      var curated = {};
      (state.groups||[]).forEach(function(g){
        g.items.forEach(function(it){ curated[it.name] = 1; });
      });
      var rest = allMorphs.filter(function(n){ return !curated[n]; });
      var gb = groupBox('全モーフ (' + rest.length + ' / 計 ' + allMorphs.length + ')');
      rest.forEach(function(n){
        gb.rows.appendChild(morphSliderRow(n, n.replace(/^Fcl_/,'')));
      });
      main.appendChild(gb.box);
    }
  }

  // ---- ポーズペイン ----
  function renderPose(){
    var p = state.pose || {};
    var ops = el('div','ops');
    var cap = el('button','sub','基準=現在姿勢');
    cap.onclick = function(){ post('/app/pose/base', {kind:'capture'}); };
    var rest = el('button','sub','基準=素立ち');
    rest.onclick = function(){ post('/app/pose/base', {kind:'rest'}); };
    ops.appendChild(cap); ops.appendChild(rest);
    main.appendChild(ops);

    var gbB = groupBox('関節 (選択して回転を編集)');
    gbB.rows.appendChild(chipList(
      (p.bones||[]).map(function(b){ return {label:b.label, name:b.name}; }),
      function(it){ return it.name === p.editBone; },
      function(it){ post('/app/pose/bone', {name:it.name}); }));
    main.appendChild(gbB.box);

    var e = p.euler || [0,0,0];
    var gbR = groupBox('回転 (' + (p.editBone||'') + ') [度]');
    ['X','Y','Z'].forEach(function(ax, i){
      gbR.rows.appendChild(sliderRow(ax, -180, 180, 1, e[i],
        function(v){ return v.toFixed(0) + '°'; },
        function(v){ sendThrottled('rot:'+i, '/app/pose/rot', {axis:i, deg:v}); }));
    });
    main.appendChild(gbR.box);

    var h = p.hips || [0,0,0];
    var gbH = groupBox('腰の移動 (ルートモーション) [m]');
    ['X','Y','Z'].forEach(function(ax, i){
      gbH.rows.appendChild(sliderRow(ax, -0.5, 0.5, 0.01, h[i],
        function(v){ return v.toFixed(2); },
        function(v){ sendThrottled('hp:'+i, '/app/pose/hips', {axis:i, m:v}); }));
    });
    main.appendChild(gbH.box);

    var ops2 = el('div','ops');
    var nameIn = el('input'); nameIn.type='text'; nameIn.placeholder='ポーズ名 (保存キー)';
    nameIn.value = p.poseName || '';
    var save = el('button','act','保存');
    save.onclick = function(){
      var id = nameIn.value.trim();
      if (!id) { alert('ポーズ名を入力してください'); return; }
      post('/app/pose/save', {id:id});
    };
    ops2.appendChild(nameIn); ops2.appendChild(save);
    main.appendChild(ops2);

    main.appendChild(chipList(
      (p.poses||[]).map(function(id){ return {label:id, id:id}; }),
      function(){ return false; },
      function(it){ post('/app/pose/load', {id:it.id}); }));
  }

  // ---- 連番(シーケンス)ペイン ----
  function renderSeq(){
    var q = state.seq || {steps:[], sel:-1, emotes:[]};
    var gbS = groupBox('手順');
    if (q.steps.length){
      gbS.rows.appendChild(chipList(
        q.steps.map(function(s,i){ return {label:(i+1)+':'+s.pose + (s.expr?'('+s.expr+')':''), i:i}; }),
        function(it){ return it.i === q.sel; },
        function(it){ post('/app/seq/select', {i:it.i}); }));
    } else {
      gbS.rows.appendChild(el('div','hint','手順がありません。下の保存済みポーズを追加してください。'));
    }
    main.appendChild(gbS.box);

    var poses = (state.pose && state.pose.poses) || [];
    var gbA = groupBox('追加 (保存済みポーズ → 末尾へ)');
    if (poses.length){
      gbA.rows.appendChild(chipList(
        poses.map(function(id){ return {label:id, id:id}; }),
        function(){ return false; },
        function(it){ post('/app/seq/add', {id:it.id}); }));
    } else {
      gbA.rows.appendChild(el('div','hint','保存済みポーズがありません (ポーズタブで保存してください)。'));
    }
    main.appendChild(gbA.box);

    if (q.sel >= 0 && q.sel < q.steps.length){
      var s = q.steps[q.sel];
      var gbE = groupBox('手順 ' + (q.sel+1) + ' [' + s.pose + ']');
      gbE.rows.appendChild(sliderRow('保持 [秒]', 0, 3, 0.05, s.hold,
        function(v){ return v.toFixed(2); },
        function(v){ s.hold = v; sendThrottled('sh', '/app/seq/hold', {sec:v}); }));
      gbE.rows.appendChild(sliderRow('遷移 [秒]', 0, 3, 0.05, s.trans,
        function(v){ return v.toFixed(2); },
        function(v){ s.trans = v; sendThrottled('st', '/app/seq/trans', {sec:v}); }));
      var ops = el('div','ops');
      [['▲ 前へ',-1],['▼ 後へ',1]].forEach(function(m){
        var b = el('button','sub',m[0]);
        b.onclick = function(){ post('/app/seq/move', {dir:m[1]}); };
        ops.appendChild(b);
      });
      var del = el('button','sub','削除');
      del.onclick = function(){ post('/app/seq/del'); };
      ops.appendChild(del);
      gbE.rows.appendChild(ops);
      var eb = [{label:'無し', name:'none', cur: s.expr === ''}];
      (q.emotes||[]).forEach(function(e){
        eb.push({label:e.label, name:e.name, cur: s.expr === e.name});
      });
      var gbX = groupBox('表情 (この手順の間だけ適用)');
      gbX.rows.appendChild(chipList(eb,
        function(it){ return it.cur; },
        function(it){ post('/app/seq/expr', {name:it.name}); }));
      main.appendChild(gbE.box);
      main.appendChild(gbX.box);
    }

    var gbO = groupBox('操作');
    var ops2 = el('div','ops');
    [['再生','/app/seq/preview','act'],['停止','/app/seq/stop','sub'],
     ['全消去','/app/seq/clear','sub']].forEach(function(m){
      var b = el('button', m[2], m[0]);
      b.onclick = function(){ post(m[1]); };
      ops2.appendChild(b);
    });
    gbO.rows.appendChild(ops2);
    var ops3 = el('div','ops');
    var fileIn = el('input'); fileIn.type='text';
    fileIn.placeholder='出力ファイル'; fileIn.value='poseseq.vrma';
    var exp = el('button','act','VRMA 書出');
    exp.onclick = function(){ post('/app/seq/export', {file:fileIn.value.trim()}); };
    ops3.appendChild(fileIn); ops3.appendChild(exp);
    gbO.rows.appendChild(ops3);
    main.appendChild(gbO.box);
  }

  // ---- キャラペイン ----
  function renderChar(){
    var c = state.chars;
    if (!c) { main.appendChild(el('div','hint','キャラレジストリが未初期化です。')); return; }

    var gbL = groupBox('登録キャラ (選択 → スロットへ割当)');
    gbL.rows.appendChild(chipList(
      (c.list||[]).map(function(e){ return {label:e.name + ' (' + e.id + ')', id:e.id}; }),
      function(it){ return it.id === c.sel; },
      function(it){ post('/app/char/select', {id:it.id}); }));
    var ops = el('div','ops');
    var toL = el('button','act','左へ割当');
    toL.onclick = function(){ post('/app/char/assign', {slot:0}); };
    var toR = el('button','act','右へ割当');
    toR.onclick = function(){ post('/app/char/assign', {slot:1}); };
    var slots = el('span','hint',
      '現在: 左=' + (c.slotNames?c.slotNames[0]:'-') + ' / 右=' + (c.slotNames?c.slotNames[1]:'-'));
    ops.appendChild(toL); ops.appendChild(toR); ops.appendChild(slots);
    gbL.rows.appendChild(ops);
    main.appendChild(gbL.box);

    var gbR = groupBox('新規登録');
    var idIn = el('input'); idIn.type='text'; idIn.placeholder='id (半角英数)';
    var nameIn = el('input'); nameIn.type='text'; nameIn.placeholder='表示名';
    var vrmIn = el('input'); vrmIn.type='text'; vrmIn.placeholder='VRM ファイル (ストレージ名)';
    var rowsWrap = el('div','ops');
    rowsWrap.appendChild(idIn); rowsWrap.appendChild(nameIn); rowsWrap.appendChild(vrmIn);
    gbR.rows.appendChild(rowsWrap);
    var radio = el('div','radio');
    var fz1 = el('label', null, ''); var r1 = el('input'); r1.type='radio'; r1.name='fz'; r1.checked=true;
    fz1.appendChild(r1); fz1.appendChild(document.createTextNode(' 正面=+Z'));
    var fz2 = el('label', null, ''); var r2 = el('input'); r2.type='radio'; r2.name='fz';
    fz2.appendChild(r2); fz2.appendChild(document.createTextNode(' 正面=-Z'));
    radio.appendChild(fz1); radio.appendChild(fz2);
    var reg = el('button','act','登録');
    reg.onclick = function(){
      var id = idIn.value.trim();
      if (!id || !vrmIn.value.trim()) { alert('id と VRM ファイル名を入力してください'); return; }
      post('/app/char/register', {id:id, name:nameIn.value.trim() || id,
        vrm:vrmIn.value.trim(), frontZ: r1.checked ? 1 : -1});
    };
    radio.appendChild(reg);
    gbR.rows.appendChild(radio);
    main.appendChild(gbR.box);
  }

  // ---- サイドバー: インスペクター + 操作ログ (SSE ~4Hz で常時更新) ----
  function renderSide(){
    side.innerHTML = '';
    if (!state || !state.ready) return;
    var ins = state.insp || {};
    var gbI = groupBox('インスペクター' + (ins.fps ? ' (FPS ' + ins.fps + ')' : ''));
    (ins.chars||[]).forEach(function(c){
      var box = el('div', 'ins-char' + (c.selected ? ' sel' : ''));
      box.appendChild(el('div','nm', (c.selected ? '● ' : '○ ') + c.name));
      var kv = [['表情', c.expr], ['動作', c.motion],
                ['目線', c.look ? 'ON' : 'off'], ['瞬き', c.blink ? 'ON' : 'off'],
                ['idle', c.idle ? 'ON' : 'off'], ['構図', c.frame]];
      if (state.op && state.op.mode === 'space')
        kv.push(['位置', 'x' + (+c.x).toFixed(1) + ' z' + (+c.z).toFixed(1)]);
      kv.forEach(function(p){
        var row = el('div','ins-kv');
        row.appendChild(el('span','k', p[0]));
        row.appendChild(el('span','v', String(p[1])));
        box.appendChild(row);
      });
      gbI.rows.appendChild(box);
    });
    gbI.rows.classList.remove('rows');   // padding は ins-char 側で持つ
    side.appendChild(gbI.box);

    var gbL = groupBox('操作ログ');
    var lg = el('div'); lg.id = 'oplog';
    lg.textContent = (state.log||[]).join('\n');
    gbL.rows.appendChild(lg);
    side.appendChild(gbL.box);
    lg.scrollTop = lg.scrollHeight;
  }

  // ---- エディタ本体の描画 (作業モードでペイン切替) ----
  function render(){
    if (!state) return;
    document.getElementById('notready').style.display = state.ready ? 'none' : 'block';
    var modes = document.getElementById('modes');
    modes.innerHTML = '';
    MODES.forEach(function(m){
      var b = el('button', state.workMode === m[0] ? 'on' : null, m[1]);
      b.onclick = function(){ post('/app/workmode', {mode:m[0]}); };
      modes.appendChild(b);
    });
    main.innerHTML = '';
    if (!state.ready) return;
    if (state.workMode === 'op') renderOp();
    else if (state.workMode === 'face') renderFace();
    else if (state.workMode === 'pose') renderPose();
    else if (state.workMode === 'seq') renderSeq();
    else if (state.workMode === 'char') renderChar();
    else main.appendChild(el('div','hint', '不明な作業モード (' + state.workMode + ') です。'));
  }

  // insp/log は 4Hz で更新されるので、エディタ部はそれ以外が変わったときだけ再構築
  function editorKey(s){
    var c = {};
    Object.keys(s).forEach(function(k){ if (k !== 'insp' && k !== 'log') c[k] = s[k]; });
    return JSON.stringify(c);
  }
  function applyState(s){
    state = s;
    renderSide();
    var k = editorKey(s);
    if (k !== lastEditorKey && !dragging){ lastEditorKey = k; render(); }
  }

  function refresh(){
    return fetch('/app/state').then(function(r){ return r.json(); })
      .then(function(s){ applyState(s); })
      .catch(function(){ statusEl.textContent = 'state fetch failed'; });
  }

  // SSE: 状態 push (操作後 + tick 4Hz の変化時)
  var es = new EventSource('/sub/state');
  es.onopen = function(){ statusEl.textContent = 'connected'; };
  es.onerror = function(){ statusEl.textContent = 'disconnected (retrying)'; };
  es.onmessage = function(e){
    try { applyState(JSON.parse(e.data)); } catch(_){}
  };

  // ---- REPL コンソール (エンジンの /events + /cmd をそのまま利用) ----
  var consoleEl = document.getElementById('console');
  var ctoggle = document.getElementById('ctoggle');
  var clog = document.getElementById('clog');
  var ccmd = document.getElementById('ccmd');
  var cprompt = document.getElementById('cprompt');
  var chist = [], chpos = -1, ces = null;

  function cappend(cls, text){
    var stick = clog.scrollHeight - clog.scrollTop - clog.clientHeight < 40;
    var d = el('div', cls, text);
    clog.appendChild(d);
    while (clog.childNodes.length > 2000) clog.removeChild(clog.firstChild);
    if (stick) clog.scrollTop = clog.scrollHeight;
  }
  function consoleOpen(){
    consoleEl.classList.add('show');
    ctoggle.classList.add('on');
    if (!ces){
      ces = new EventSource('/events');   // エンジンログ (バックログ付き)
      ces.onmessage = function(e){
        try { var m = JSON.parse(e.data); cappend(m.cls || 'info', m.text || ''); }
        catch(_){}
      };
    }
    ccmd.focus();
  }
  function consoleClose(){
    consoleEl.classList.remove('show');
    ctoggle.classList.remove('on');
  }
  ctoggle.onclick = function(){
    if (consoleEl.classList.contains('show')) consoleClose(); else consoleOpen();
  };
  ccmd.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      e.preventDefault();
      var line = ccmd.value;
      ccmd.value = ''; chpos = -1;
      fetch('/cmd', {method:'POST', body: line})
        .then(function(r){ return r.text(); })
        .then(function(cont){
          cprompt.innerHTML = (cont === '1') ? '&nbsp;&nbsp;...&gt;' : 'krkrz&gt;';
        }).catch(function(){});
      if (line.trim() !== '' && (chist.length === 0 || chist[chist.length-1] !== line))
        chist.push(line);
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (chist.length){ if (chpos < 0) chpos = chist.length; if (chpos > 0) chpos--; ccmd.value = chist[chpos]; }
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (chpos >= 0){ chpos++; if (chpos >= chist.length){ chpos = -1; ccmd.value = ''; } else ccmd.value = chist[chpos]; }
    }
  });

  refresh();
})();
</script>
</body></html>
